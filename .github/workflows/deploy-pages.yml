name: Deploy Web Panel to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "artifacts/web-panel/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fallback setup-node without cache (if pnpm cache setup fails)
        if: failure()
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Auto-enables GitHub Pages (source: GitHub Actions) on first run,
      # so no manual repo-settings change is required.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: |
          echo "pnpm $(pnpm --version) node $(node --version)"
          pnpm install --frozen-lockfile
          echo "Install ok"
          pnpm ls --depth 0 2>&1 | head -n 20

      - name: Resolve BASE_PATH (auto-detect CNAME)
        id: base_path
        run: |
          if [ -f CNAME ]; then
            echo "CNAME found -> BASE_PATH=/ for custom domain $(cat CNAME)"
            echo "value=/" >> $GITHUB_OUTPUT
          elif [ -n "${{ vars.BASE_PATH }}" ]; then
            echo "Using vars.BASE_PATH=${{ vars.BASE_PATH }}"
            echo "value=${{ vars.BASE_PATH }}" >> $GITHUB_OUTPUT
          else
            echo "Using default /Parivahan-Panel-Sync/"
            echo "value=/Parivahan-Panel-Sync/" >> $GITHUB_OUTPUT
          fi

      - name: Build web panel
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          BASE_PATH: ${{ steps.base_path.outputs.value }}
        run: |
          echo "Building with VITE_API_URL=$VITE_API_URL BASE_PATH=$BASE_PATH"
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::VITE_API_URL not set - panel will try same-origin /api (fails on GH Pages)"
          fi
          pnpm --filter @workspace/web-panel run build
          echo "Build output:"
          ls -lh artifacts/web-panel/dist/public/ | head -n 20

      - name: Add CNAME for custom domain
        run: |
          if [ -f CNAME ]; then
            cp CNAME artifacts/web-panel/dist/public/CNAME
            echo "CNAME added: $(cat CNAME)"
          else
            echo "No CNAME - set custom domain in Pages settings if needed"
          fi

      - name: Add .nojekyll
        run: touch artifacts/web-panel/dist/public/.nojekyll

      - name: SPA fallback (404 -> index.html)
        run: |
          cp artifacts/web-panel/dist/public/index.html artifacts/web-panel/dist/public/404.html
          echo "SPA fallback created"

      - name: Verify build artifact
        run: |
          test -f artifacts/web-panel/dist/public/index.html || (echo "ERROR index.html missing" && exit 1)
          test -f artifacts/web-panel/dist/public/404.html || (echo "ERROR 404.html missing" && exit 1)
          du -sh artifacts/web-panel/dist/public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/web-panel/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

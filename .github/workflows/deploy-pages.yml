name: Deploy Web Panel to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "artifacts/web-panel/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fallback setup-node without cache (if pnpm cache setup fails)
        if: failure()
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Auto-enables GitHub Pages (source: GitHub Actions) on first run,
      # so no manual repo-settings change is required.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web panel
        env:
          # API base URL the panel talks to. Set repo variable VITE_API_URL
          # (Settings > Secrets and variables > Actions > Variables) to your
          # hosted API server, e.g. https://parivahan-api.onrender.com
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Custom domain => base path stays "/". For a project page without a
          # custom domain, set repo variable BASE_PATH to "/<repo-name>/".
          BASE_PATH: ${{ vars.BASE_PATH || '/Parivahan-Panel-Sync/' }}
        run: pnpm --filter @workspace/web-panel run build

      - name: Add CNAME for custom domain
        run: |
          if [ -f CNAME ]; then
            cp CNAME artifacts/web-panel/dist/public/CNAME
            echo "CNAME added: $(cat CNAME)"
          else
            echo "No root CNAME file found; skipping (configure custom domain in Pages settings)."
          fi

      - name: Add .nojekyll
        run: touch artifacts/web-panel/dist/public/.nojekyll

      - name: SPA fallback (404 -> index.html)
        run: cp artifacts/web-panel/dist/public/index.html artifacts/web-panel/dist/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/web-panel/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

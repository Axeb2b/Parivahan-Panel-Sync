[build]
  command = "pnpm --filter @workspace/web-panel run build"
  publish = "artifacts/web-panel/dist/public"

[build.environment]
  NODE_VERSION = "24"
  BASE_PATH = "/"

# SPA fallback — client-side routing (wouter) handles all paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
